<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#cfd9e8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".74"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="120" height="120" rx="27"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="120" height="120" fill="url(#bg)"/>
    <g transform="translate(60 60)">
      <circle r="13" fill="#fff"/>
      <ellipse rx="11" ry="30" fill="#ff5f57" transform="rotate(0) translate(0 -23)"/>
      <ellipse rx="11" ry="30" fill="#ffbd2e" transform="rotate(45) translate(0 -23)"/>
      <ellipse rx="11" ry="30" fill="#28c840" transform="rotate(90) translate(0 -23)"/>
      <ellipse rx="11" ry="30" fill="#5ac8fa" transform="rotate(135) translate(0 -23)"/>
      <ellipse rx="11" ry="30" fill="#007aff" transform="rotate(180) translate(0 -23)"/>
      <ellipse rx="11" ry="30" fill="#af52de" transform="rotate(225) translate(0 -23)"/>
      <ellipse rx="11" ry="30" fill="#ff2d55" transform="rotate(270) translate(0 -23)"/>
      <ellipse rx="11" ry="30" fill="#ff9500" transform="rotate(315) translate(0 -23)"/>
      <circle r="15" fill="#fff" opacity=".92"/>
    </g>
    <rect width="120" height="44" fill="url(#gloss)" opacity=".42"/>
  </g>
</svg>
